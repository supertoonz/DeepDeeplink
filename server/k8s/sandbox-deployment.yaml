apiVersion: apps/v1
kind: Deployment
metadata:
  name: deferred-deeplink-server
  labels:
    app: deferred-deeplink-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deferred-deeplink-server
  template:
    metadata:
      labels:
        app: deferred-deeplink-server
    spec:
      containers:
      - name: deferred-deeplink-server
        image: 549918006255.dkr.ecr.ap-southeast-1.amazonaws.com/scb-ploy/deferred-deeplink-server
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: deferred-deeplink-server-svc
spec:
  selector:
    app: deferred-deeplink-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
